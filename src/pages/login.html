<div class="auth-split-container">
  <!-- Left Side: Hero Section with Generated 3D Artwork -->
  <div class="auth-hero-side">
    <div class="auth-hero-overlay"></div>
    <div class="auth-hero-content">
      <h1 class="auth-hero-title">Take Control of Your Personal Finances</h1>
      <p class="auth-hero-subtitle">SmartFinance gives you 100% offline control, intelligent savings tracking, and instant MySQL analytics.</p>
    </div>
  </div>

  <!-- Right Side: Login Form -->
  <div class="auth-form-side">
    <div class="auth-card card">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:24px;">
        <span style="font-size:2rem;">💰</span>
        <h2 style="font-size:1.6rem; font-weight:800; background:var(--accent-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">SmartFinance</h2>
      </div>
      <h3 class="auth-title">Welcome Back</h3>
      <p class="auth-subtitle">Enter your credentials to access your financial dashboard</p>

      <form id="login-form" onsubmit="Auth.handleLogin(event); return false;">
        <div class="form-group">
          <label class="form-label" for="login-username">Username</label>
          <input type="text" id="login-username" class="form-control" placeholder="Enter username" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; padding:14px; margin-top:8px;">Sign In</button>
      </form>

      <div style="margin-top:24px; text-align:center; font-size:0.9rem; color:var(--text-secondary);">
        Don't have an account? <a href="#" id="to-register-link" onclick="Auth.showRegister(); return false;" style="font-weight:600;">Create Account</a>
      </div>
    </div>
  </div>
</div>
