<div style="max-width:800px; margin:0 auto;">

  <!-- MySQL Connection Settings Card -->
  <div class="card" style="margin-bottom:28px;">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
      <span style="font-size:1.6rem;">🛢️</span>
      <div>
        <h3 style="font-size:1.2rem; font-weight:700;">MySQL Database Configuration</h3>
        <p style="font-size:0.85rem; color:var(--text-secondary);">Connect SmartFinance directly to your local or remote MySQL Server (XAMPP / MySQL Workbench)</p>
      </div>
    </div>

    <form id="mysql-config-form">
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px; background:rgba(255,255,255,0.03); padding:12px 16px; border-radius:var(--radius-sm);">
        <input type="checkbox" id="mysql-enabled" style="width:18px; height:18px; cursor:pointer;">
        <label for="mysql-enabled" style="font-weight:600; cursor:pointer;">Enable MySQL Database Mode (Default: Offline SQLite)</label>
      </div>

      <div style="display:grid; grid-template-columns:2fr 1fr; gap:14px;">
        <div class="form-group">
          <label class="form-label" for="mysql-host">Host / IP Address</label>
          <input type="text" id="mysql-host" class="form-control" placeholder="localhost" value="localhost">
        </div>
        <div class="form-group">
          <label class="form-label" for="mysql-port">Port</label>
          <input type="number" id="mysql-port" class="form-control" placeholder="3306" value="3306">
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
        <div class="form-group">
          <label class="form-label" for="mysql-user">Username</label>
          <input type="text" id="mysql-user" class="form-control" placeholder="root" value="root">
        </div>
        <div class="form-group">
          <label class="form-label" for="mysql-pass">Password</label>
          <input type="password" id="mysql-pass" class="form-control" placeholder="Leave empty if none">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="mysql-dbname">Database Name</label>
        <input type="text" id="mysql-dbname" class="form-control" placeholder="smartfinance" value="smartfinance">
      </div>

      <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px;">
        <button type="button" class="btn btn-secondary" id="mysql-test-btn">🔌 Test Connection</button>
        <button type="submit" class="btn btn-primary">Save MySQL Settings</button>
      </div>
    </form>
  </div>

  <!-- Profile Settings -->
  <div class="card" style="margin-bottom:28px;">
    <h3 style="font-size:1.2rem; font-weight:700; margin-bottom:18px;">Profile & Preference Settings</h3>
    <form id="profile-settings-form">
      <div class="form-group">
        <label class="form-label" for="set-fullname">Full Name</label>
        <input type="text" id="set-fullname" class="form-control" required>
      </div>

      <div style="display:grid; grid-template-columns:2fr 1fr; gap:14px;">
        <div class="form-group">
          <label class="form-label" for="set-email">Email Address</label>
          <input type="email" id="set-email" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label" for="set-currency">Default Currency</label>
          <select id="set-currency" class="form-control">
            <option value="LKR">LKR (Rs.)</option>
            <option value="USD">USD ($)</option>
            <option value="EUR">EUR (€)</option>
            <option value="GBP">GBP (£)</option>
            <option value="INR">INR (₹)</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="margin-top:8px;">Update Profile</button>
    </form>
  </div>

</div>
