<div class="card" style="max-width:600px; margin:0 auto;">
  <h3 style="font-size:1.3rem; font-weight:700; margin-bottom:12px;">Export Financial Data</h3>
  <p style="color:var(--text-secondary); margin-bottom:24px;">Export your transaction history to PDF or Excel format for record keeping.</p>

  <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
    <button class="btn btn-primary" style="padding:20px; flex-direction:column; gap:8px;" onclick="Export.exportJSON()">
      <span style="font-size:2rem;">📄</span>
      <span>Export Full JSON Backup</span>
    </button>

    <button class="btn btn-secondary" style="padding:20px; flex-direction:column; gap:8px;" onclick="Export.importJSON()">
      <span style="font-size:2rem;">📥</span>
      <span>Restore From JSON</span>
    </button>
  </div>
</div>
