<div class="card" style="margin-bottom:24px; display:flex; justify-content:space-between; align-items:center;">
  <h3 style="font-size:1.2rem; font-weight:700;">Categories Overview</h3>
  <button class="btn btn-primary" onclick="Categories.showAddModal()">+ Add Custom Category</button>
</div>

<div id="categories-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:20px;">
  <div style="grid-column: 1/-1; text-align:center; padding:30px; color:var(--text-muted);">Loading categories...</div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="category-modal">
  <div class="modal card">
    <h3 style="font-size:1.3rem; font-weight:700; margin-bottom:20px;">Add New Category</h3>
    <form id="category-form">
      <div class="form-group">
        <label class="form-label" for="cat-name">Category Name</label>
        <input type="text" id="cat-name" class="form-control" placeholder="e.g. Subscriptions" required>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="form-group">
          <label class="form-label" for="cat-type">Type</label>
          <select id="cat-type" class="form-control">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="cat-icon">Emoji Icon</label>
          <input type="text" id="cat-icon" class="form-control" placeholder="📦" value="📦">
        </div>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
        <button type="button" class="btn btn-secondary" onclick="Categories.hideModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Category</button>
      </div>
    </form>
  </div>
</div>
