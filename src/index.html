<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartFinance - Personal Finance Tracker</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <!-- Auth Layout -->
  <div id="auth-layout" class="auth-layout">
    <div id="auth-content" style="width:100%; height:100%;"></div>
  </div>

  <!-- App Layout -->
  <div id="app-layout" class="app-layout" style="display:none;">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-logo">💰</span>
        <h1 class="sidebar-title">SmartFinance</h1>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-page="dashboard">
          <span class="nav-icon">🏠</span>
          <span class="nav-text">Dashboard</span>
        </a>
        <a href="#" class="nav-item" data-page="add-transaction">
          <span class="nav-icon">➕</span>
          <span class="nav-text">Add Transaction</span>
        </a>
        <a href="#" class="nav-item" data-page="transactions">
          <span class="nav-icon">📋</span>
          <span class="nav-text">Transactions</span>
        </a>
        <a href="#" class="nav-item" data-page="goals">
          <span class="nav-icon">🎯</span>
          <span class="nav-text">Savings Goals</span>
        </a>
        <a href="#" class="nav-item" data-page="categories">
          <span class="nav-icon">🏷️</span>
          <span class="nav-text">Categories</span>
        </a>
        <a href="#" class="nav-item" data-page="reports">
          <span class="nav-icon">📊</span>
          <span class="nav-text">Reports</span>
        </a>
        <a href="#" class="nav-item" data-page="budget">
          <span class="nav-icon">💰</span>
          <span class="nav-text">Budget</span>
        </a>
        <a href="#" class="nav-item" data-page="export">
          <span class="nav-icon">📥</span>
          <span class="nav-text">Export</span>
        </a>
        <a href="#" class="nav-item" data-page="settings">
          <span class="nav-icon">⚙️</span>
          <span class="nav-text">Settings</span>
        </a>
      </nav>
      <div class="sidebar-footer" style="margin-top:auto; font-size:0.8rem; color:var(--text-muted);">
        <span>SmartFinance v1.0</span>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-content">
      <header class="header">
        <h2 class="header-title" id="page-title">Dashboard</h2>
        <div class="header-actions">
          <div class="header-user" id="header-user">
            <div class="user-avatar" id="user-avatar">U</div>
            <span class="user-name" id="user-name">User</span>
          </div>
          <button class="btn btn-ghost" id="logout-btn" title="Logout">🚪 Logout</button>
        </div>
      </header>

      <div class="page-content" id="page-content"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="../node_modules/chart.js/dist/chart.umd.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/transactions.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/budget.js"></script>
  <script src="js/export.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
