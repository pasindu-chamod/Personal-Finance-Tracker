<div class="card" style="margin-bottom:24px; display:flex; justify-content:space-between; align-items:center;">
  <div>
    <h3 style="font-size:1.2rem; font-weight:700;">Monthly Budget Limits</h3>
    <p style="font-size:0.85rem; color:var(--text-secondary);">Set category-wise spending limits to maintain strict financial discipline.</p>
  </div>
  <button class="btn btn-primary" onclick="Budget.showAddModal()">+ Set Budget Limit</button>
</div>

<div id="budget-list" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:24px;">
  <div style="grid-column: 1/-1; text-align:center; padding:30px; color:var(--text-muted);">Loading budget limits...</div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="budget-modal">
  <div class="modal card">
    <h3 style="font-size:1.3rem; font-weight:700; margin-bottom:20px;">Set Monthly Budget</h3>
    <form id="budget-form">
      <div class="form-group">
        <label class="form-label" for="budget-cat">Expense Category</label>
        <select id="budget-cat" class="form-control" required></select>
      </div>

      <div class="form-group">
        <label class="form-label" for="budget-amount">Monthly Limit Amount</label>
        <input type="number" step="0.01" id="budget-amount" class="form-control" placeholder="25000.00" required>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
        <button type="button" class="btn btn-secondary" onclick="Budget.hideModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Budget</button>
      </div>
    </form>
  </div>
</div>
